<!DOCTYPE html>
<html>
<head>
    <title>Food Dot PK</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🍔 Food Dot PK</h1>
    <p>Lahore's Fastest Food Delivery</p>
</header>

<nav>
    <a href="#burgers">Burgers</a>
    <a href="#deals">Deals</a>
    <a href="#order">Order Now</a>
</nav>

<section id="hero">
    <h2>Fresh & Hot Burgers Delivered 😋</h2>
    <button onclick="orderNow()">Order on WhatsApp</button>
</section>

<section id="burgers">
    <h2>Our Burgers</h2>
    <div class="card">Zinger Burger</div>
    <div class="card">Chicken Patty Burger</div>
    <div class="card">Anda Shami Burger</div>
</section>

<section id="deals">
    <h2>Hot Deals 🔥</h2>
    <div class="card">2 Zinger Burger + Fries = Rs 1250</div>
    <div class="card">3 Zinger + 1L Cola = Rs 1750</div>
</section>

<section id="order">
    <h2>Order Now</h2>
    <button onclick="orderNow()">WhatsApp Order</button>
</section>

<footer>
    <p>© 2026 Food Dot PK</p>
</footer>

<script src="script.js"></script>
</body>
</html>
